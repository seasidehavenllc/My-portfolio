# After every merge to main that changes the app or the pages it packages,
# build the iPhone app and upload it to TestFlight. Setup: app/TESTFLIGHT.md
name: iPhone app to TestFlight

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "assets/**"
      - "manifest.webmanifest"
      - "app/**"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch: # also adds a "Run workflow" button on the Actions tab

concurrency:
  group: ios-testflight
  cancel-in-progress: true # a newer merge replaces a build still in progress

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
      DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the Apple secrets are set
        run: |
          missing=""
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 DIST_CERT_P12_BASE64 DIST_CERT_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing. See app/TESTFLIGHT.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Copy the website into the app
        run: |
          npm ci
          node copy-web.mjs
          npx cap sync ios

      - name: Xcode version
        run: xcodebuild -version

      - name: Build and upload to TestFlight
        run: fastlane ios beta
